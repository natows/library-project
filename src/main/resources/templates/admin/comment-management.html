<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Zarządzanie komentarzami</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <h1 class="mb-4">Zarządzanie komentarzami</h1>

    <!-- Komunikaty sukcesu/błędu -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Tabela komentarzy -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Treść</th>
                <th>Użytkownik</th>
                <th>Książka</th>
                <th>Data</th>
                <th>Akcje</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="comment : ${comments.content}">
                <td th:text="${comment.id}">1</td>
                <td th:text="${#strings.abbreviate(comment.content, 50)}">Treść...</td>
                <td th:text="${comment.username}">Użytkownik</td>
                <td th:text="${comment.bookTitle}">Tytuł</td>
                <td th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">Data</td>
                <td>
                    <div class="btn-group" role="group">
                        <a th:href="@{/admin/comment-management/edit/{id}(id=${comment.id})}" class="btn btn-primary btn-sm">Edytuj</a>
                        <form th:action="@{/admin/comment-management/delete/{id}(id=${comment.id})}" method="post" 
                              th:onsubmit="return confirm('Czy na pewno chcesz usunąć ten komentarz?');" style="display: inline;">
                            <button type="submit" class="btn btn-danger btn-sm">Usuń</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Paginacja -->
    <nav th:if="${comments.totalPages > 1}" aria-label="Nawigacja strony">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${comments.first} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/comment-management(page=${comments.number - 1})}" aria-label="Poprzednia">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, comments.totalPages - 1)}"
                th:classappend="${i == comments.number} ? 'active'">
                <a class="page-link" th:href="@{/admin/comment-management(page=${i})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${comments.last} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/comment-management(page=${comments.number + 1})}" aria-label="Następna">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
