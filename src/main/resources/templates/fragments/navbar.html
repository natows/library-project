<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style th:fragment="navbar-styles">
        .navbar-custom {
            background-color: #2c3e50;
            border-bottom: 3px solid #8b4513;
            padding: 1rem 2rem;
        }

        .navbar-custom .navbar-brand {
            color: #f8f9fa !important;
            font-size: 1.5rem;
            font-weight: 600;
            font-family: 'Georgia', serif;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .navbar-custom .navbar-brand:hover {
            color: #d4af37 !important;
        }

        .navbar-custom .navbar-brand svg {
            width: 28px;
            height: 28px;
            color: #d4af37;
        }

        .navbar-custom .nav-link {
            color: #e9ecef !important;
            font-size: 0.95rem;
            padding: 0.5rem 1rem !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: color 0.2s ease;
        }

        .navbar-custom .nav-link:hover {
            color: #d4af37 !important;
        }

        .navbar-custom .nav-link.active {
            color: #d4af37 !important;
            font-weight: 500;
        }

        .btn-navbar {
            background-color: #8b4513;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 4px;
            font-weight: 500;
            border: 1px solid #8b4513;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .btn-navbar:hover {
            background-color: #a0522d;
            border-color: #a0522d;
            color: white;
        }

        .navbar-toggler {
            border-color: rgba(255,255,255,0.3);
        }

        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255, 255, 255, 0.8%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-custom" th:fragment="navbar">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">
            <svg fill="currentColor" viewBox="0 0 20 20">
                <path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"/>
            </svg>
            Library
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">

                <li class="nav-item" sec:authorize="isAuthenticated() and hasRole('USER')">
                    <a class="nav-link" th:href="@{/user/my-reservations}">Moje rezerwacje</a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated() and hasRole('USER')">
                    <a class="nav-link" th:href="@{/user/history}">Historia wypożyczeń</a>
                </li>

                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link btn-navbar ms-2" href="/login">Zaloguj</a>
                </li>

                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link btn-navbar ms-2" href="/register">Utwórz konto</a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated() and hasRole('ADMIN')">
                    <a class="nav-link btn-navbar ms-2" href="/admin/book-management">Książki</a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated() and hasRole('ADMIN')">
                    <a class="nav-link btn-navbar ms-2" href="/admin/user-management">Użytkownicy</a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated() and hasRole('ADMIN')">
                    <a class="nav-link btn-navbar ms-2" href="/admin/comment-management">Komentarze</a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated() and hasRole('ADMIN')">
                    <a class="nav-link btn-navbar ms-2" href="/admin/manage-reservations">Otwarte rezerwacje</a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated() and hasRole('ADMIN')">
                    <a class="nav-link btn-navbar ms-2" href="/admin/stats">Stats</a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" style="display: inline; margin: 0;">
                        <button type="submit" class="btn btn-navbar ms-2">
                            <i class="bi bi-box-arrow-right"></i>Wyloguj
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
